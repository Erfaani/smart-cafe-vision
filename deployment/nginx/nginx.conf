# Single entry point for the café: dashboard, API, WebSocket and display all on
# port 80, so staff and the TV only ever need one address.

upstream scv_backend {
    server backend:8000;
}

upstream scv_frontend {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;

    # A 4K public display page with an embedded logo can exceed the default.
    client_max_body_size 20M;

    # Never advertise the version to a café's guest network.
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    location /api/ {
        proxy_pass http://scv_backend;
        include /etc/nginx/proxy_params_scv;
    }

    location /admin/ {
        proxy_pass http://scv_backend;
        include /etc/nginx/proxy_params_scv;
    }

    location /static/ {
        proxy_pass http://scv_backend;
        include /etc/nginx/proxy_params_scv;
    }

    location /media/ {
        alias /var/www/media/;
        expires 7d;
    }

    location /healthz/ {
        proxy_pass http://scv_backend;
        include /etc/nginx/proxy_params_scv;
        access_log off;
    }

    location /readyz/ {
        proxy_pass http://scv_backend;
        include /etc/nginx/proxy_params_scv;
        access_log off;
    }

    # WebSocket: the dashboard and the public display hold this open for hours.
    # The long read timeout is what stops the TV silently going stale overnight.
    location /ws/ {
        proxy_pass http://scv_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Everything else is the Next.js app (dashboard + /display/<slug>).
    location / {
        proxy_pass http://scv_frontend;
        include /etc/nginx/proxy_params_scv;
    }
}
